name: Steer
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
options:
  bundleIdPrefix: app.steer
  deploymentTarget:
    iOS: "17.0"
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.15.0
  swift-nio-ssh:
    path: Vendor/swift-nio-ssh
  swift-crypto:
    url: https://github.com/apple/swift-crypto.git
    exactVersion: 4.5.1
targets:
  Steer:
    type: application
    platform: iOS
    sources:
      - path: Steer
        excludes:
          - Fonts/**
      - path: Steer/Fonts
        type: group
        buildPhase: resources
      - path: AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
      - package: swift-nio-ssh
        product: NIOSSH
      - package: swift-crypto
        product: Crypto
      - package: swift-crypto
        product: _CryptoExtras
    info:
      path: Steer/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: app.steer.ios
            CFBundleURLSchemes: [steer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.steer.ios
        PRODUCT_NAME: Steer
        SWIFT_VERSION: 6.0
        MARKETING_VERSION: 1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Steer connects over SSH to machines you add, including on your LAN or Tailscale."
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Steer uses the microphone only when you start local voice input."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Steer uses Face ID when you choose to lock the app or protect saved SSH credentials."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Steer converts your speech to terminal input on this device."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleIconName: AppIcon
  SteerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SteerTests
    dependencies:
      - target: Steer
      - package: swift-crypto
        product: Crypto
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
  SteerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: SteerUITests
      - path: SteerTests/RSAFixture.swift
    dependencies:
      - target: Steer
    settings:
      base:
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Steer:
    build:
      targets:
        Steer: all
    run:
      config: Debug
    test:
      targets:
        - SteerTests
        - SteerUITests
